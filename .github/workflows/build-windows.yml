name: Build Windows Executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller packaging/systemsieve.spec --noconfirm

      - name: Smoke test the built executable
        run: |
          .\dist\SystemSieve\SystemSieve.exe version
          .\dist\SystemSieve\SystemSieve.exe doctor

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SystemSieve-windows
          path: dist/SystemSieve/
          retention-days: 14
