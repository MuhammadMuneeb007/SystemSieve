name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Package import smoke test
        run: |
          python -c "import systemsieve; print(systemsieve.__version__)"
          python -m systemsieve version
          python -m systemsieve doctor

      # This project's automated pytest suite is still being built out. Once
      # tests/ contains real, non-destructive tests, this step will start
      # collecting and running them automatically -- see docs/testing.md for
      # the safety conventions any new tests must follow (never uninstall
      # real software or delete real files; use fakes/mocks for anything
      # destructive).
      - name: Run pytest (if tests exist)
        run: |
          if (Test-Path "tests") {
            pytest -m "not manual and not destructive" --cov=systemsieve
          } else {
            Write-Host "No tests/ directory yet; skipping pytest."
          }
