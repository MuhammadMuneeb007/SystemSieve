name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Package import smoke test
        run: |
          python -c "import systemsieve; print(systemsieve.__version__)"
          python -m systemsieve version
          python -m systemsieve doctor

      - name: Run safe automated tests
        run: pytest -m "not manual and not destructive" --cov=systemsieve
