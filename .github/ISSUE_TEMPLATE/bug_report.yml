name: Bug Report
description: Report a correctness or usability bug in SystemSieve.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If this is a security or safety issue
        (something that could cause an unintended uninstall, deletion, or privilege
        escalation), please use the Security Report template instead, or follow SECURITY.md.

  - type: input
    id: version
    attributes:
      label: SystemSieve version
      description: Output of `systemsieve version`
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 23H2"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Logs are in %LOCALAPPDATA%\SystemSieve\logs\. Please redact any personal
        information before pasting.
      render: shell

  - type: checkboxes
    id: destructive
    attributes:
      label: Did this involve dry-run mode?
      options:
        - label: I was in dry-run mode when this happened.
        - label: I had disabled dry-run mode (a real operation was performed).
