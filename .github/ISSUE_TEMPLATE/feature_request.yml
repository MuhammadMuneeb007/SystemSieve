name: Feature Request
description: Suggest an idea or enhancement for SystemSieve.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that SystemSieve doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: safety
    attributes:
      label: Safety considerations
      description: >
        If this involves uninstalling, deleting, or elevating anything, please note how it
        should interact with dry-run mode, confirmations, and protected paths/applications.
      options:
        - label: This feature does not touch uninstall, deletion, or elevation behaviour.
        - label: This feature does touch uninstall, deletion, or elevation behaviour (please describe above).
